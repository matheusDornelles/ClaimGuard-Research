[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimguard-research"
version = "0.1.0"
description = "Reproducible research prototype for provenance and manipulation analysis of claim images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "langgraph>=0.2,<2",
  "numpy>=1.26,<3",
  "Pillow>=10.3,<13",
  "opencv-python-headless>=4.10,<5",
  "scikit-learn>=1.5,<2",
  "pandas>=2.2,<4",
  "joblib>=1.4,<2",
  "streamlit>=1.38,<2",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.46,<5",
]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
claimguard = "claimguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
